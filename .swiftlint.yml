# SwiftLint config. Run ./scripts/lint.sh. Formatting is SwiftFormat's job (see .swiftformat),
# so style rules that overlap with it are disabled here.

included:
  - calendish
  - CookingActivityExtension
  - CookingActivityShared
  - ShareExtension
  - Shared
  - tests
excluded:
  - .build
  - DerivedData
  - BuildTools

disabled_rules:
  # Owned by SwiftFormat.
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - statement_position
  # Compact one-line bodies and short names (x, id, i) are used deliberately.
  - identifier_name
  - type_name
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - first_where
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

line_length:
  warning: 200
  error: 400
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
file_length:
  warning: 800
  error: 1500
type_body_length:
  warning: 500
  error: 1000
function_body_length:
  warning: 120
  error: 250
cyclomatic_complexity:
  warning: 20
  error: 40
  ignores_case_statements: true
large_tuple:
  warning: 4
  error: 6
nesting:
  type_level: 3
# Statically known regexes and test fixtures force-try on purpose; flag them without failing.
force_try: warning
force_cast: warning
